[build-system]
requires=["setuptools>=84.0.0","wheel"]
build-backend="setuptools.build_meta"
[project]
name="local-voice-ai"
version="0.1.0"
requires-python=">=3.11,<3.14"
dependencies=["fastapi>=0.116,<1","uvicorn[standard]>=0.35,<1","httpx>=0.27,<1","numpy>=2.4.6,<3","PyYAML>=6.0.3,<7","sounddevice>=0.5.6,<1","pypdf>=5,<7","pypdfium2>=4,<6","pillow>=10,<13","python-multipart>=0.0.32,<1"]
[project.optional-dependencies]
reproduction=["openpyxl==3.1.5"]
rag=[]
dev=["pytest>=9.1.1,<10","pytest-asyncio>=1.4,<2"]
asr=["qwen-asr>=0.0.6"]
tts=["qwen-tts"]
[tool.setuptools.packages.find]
include=["app*"]
[tool.pytest.ini_options]
asyncio_mode="auto"
testpaths=["tests"]
norecursedirs=["temp","backups",".local_cowork_backups",".local_cowork_rejected"]
